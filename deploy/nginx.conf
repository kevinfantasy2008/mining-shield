# Nginx 反代配置示例（服务器端 VPS）
#
# 要点：
#   1. 443 端口 + 正规 CA 证书（Let's Encrypt），流量与正常 HTTPS 无异
#   2. 根路径挂一个真实网站做伪装，主动探测看到的是正常站点
#   3. 只有访问秘密路径且带正确 token 的请求才反代给 mining-shield-server
#   4. token 在 Nginx 和应用层双重校验，认证失败一律 404

server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 伪装站点：放一个真实可访问的网站（博客、下载页均可）
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 隧道入口：路径换成与 server.yaml 中 path 一致的长随机串
    location /CHANGE-ME-random-path {
        # Nginx 层第一道 token 校验（与 server.yaml 的 token 一致）
        if ($http_x_auth_token != "CHANGE-ME-long-random-token-at-least-32-chars") {
            return 404;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Token $http_x_auth_token;

        # 挖矿是长连接，务必放宽超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}
